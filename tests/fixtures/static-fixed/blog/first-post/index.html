<h1>How automated reminders reduce patient no-shows</h1>
<p>Reminders sent 48 hours and 2 hours before a visit give patients two chances to confirm or reschedule. Clinics
that let patients reply to reschedule see fewer silent no-shows than clinics that only send one-way notices.</p>
